name: Deploy WhatAboutIt Collaboration Backend

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-whataboutit to confirm this deploy targets only What About It resources
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: whataboutit-cloudflare-collab-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.WHATABOUTIT_CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.WHATABOUTIT_CLOUDFLARE_ACCOUNT_ID }}
  WHATABOUTIT_BUCKET: whataboutit-collab-media
  WHATABOUTIT_WORKER: whataboutit-collab

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy-whataboutit' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/collab
    steps:
      - uses: actions/checkout@v4

      - name: Guard WhatAboutIt isolation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing WHATABOUTIT_CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing WHATABOUTIT_CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "$WHATABOUTIT_WORKER" = "whataboutit-collab"
          test "$WHATABOUTIT_BUCKET" = "whataboutit-collab-media"
          if grep -Rni 'gilmer' .; then
            echo "Refusing deploy: a Gilmer reference exists inside the WhatAboutIt Cloudflare package."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloudflare tooling
        run: npm ci --no-audit --no-fund

      - name: Ensure dedicated R2 bucket exists
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket create "$WHATABOUTIT_BUCKET"; then
            echo "Created $WHATABOUTIT_BUCKET"
          else
            echo "Create returned non-zero; verifying the dedicated bucket already exists."
            npx wrangler r2 bucket list | tee /tmp/r2-buckets.txt
            grep -F "$WHATABOUTIT_BUCKET" /tmp/r2-buckets.txt >/dev/null
          fi

      - name: Validate Worker configuration
        run: npx wrangler deploy --dry-run

      - name: Install per-editor collaboration access keys before deployment
        shell: bash
        env:
          WHATABOUTIT_MORGAN_ACCESS_KEY: ${{ secrets.WHATABOUTIT_MORGAN_ACCESS_KEY }}
          WHATABOUTIT_SUSAN_ACCESS_KEY: ${{ secrets.WHATABOUTIT_SUSAN_ACCESS_KEY }}
          WHATABOUTIT_LEGACY_ACCESS_KEY: ${{ secrets.WHATABOUTIT_COLLAB_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test ${#WHATABOUTIT_MORGAN_ACCESS_KEY} -ge 24 || { echo "Missing or short WHATABOUTIT_MORGAN_ACCESS_KEY"; exit 1; }
          test ${#WHATABOUTIT_SUSAN_ACCESS_KEY} -ge 24 || { echo "Missing or short WHATABOUTIT_SUSAN_ACCESS_KEY"; exit 1; }
          ACCESS_KEYS_JSON="$(node -e 'const keys={"morgan-owner":process.env.WHATABOUTIT_MORGAN_ACCESS_KEY,"susan-editor":process.env.WHATABOUTIT_SUSAN_ACCESS_KEY};if((process.env.WHATABOUTIT_LEGACY_ACCESS_KEY||"").length>=24)keys["legacy-transition"]=process.env.WHATABOUTIT_LEGACY_ACCESS_KEY;process.stdout.write(JSON.stringify(keys))')"
          printf '%s' "$ACCESS_KEYS_JSON" | npx wrangler secret put WHATABOUTIT_COLLAB_ACCESS_KEYS

      - name: Deploy dedicated collaboration Worker
        run: npx wrangler deploy

      - name: Discover collaboration service URL
        id: service
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(2);process.stdout.write(j.result.subdomain)})")"
          SERVICE_URL="https://$WHATABOUTIT_WORKER.$SUBDOMAIN.workers.dev"
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          {
            echo "## What About It collaboration deployed"
            echo ""
            echo "- Worker: \`$WHATABOUTIT_WORKER\`"
            echo "- R2 bucket: \`$WHATABOUTIT_BUCKET\`"
            echo "- Collaboration service URL: \`$SERVICE_URL\`"
            echo ""
            echo "Use this URL in What About It → Collaboration → Live Edit Control on Morgan and Susan's computers."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed Worker
        shell: bash
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
          WHATABOUTIT_COLLAB_ACCESS_KEY: ${{ secrets.WHATABOUTIT_MORGAN_ACCESS_KEY }}
        run: |
          set -euo pipefail
          curl -fsS "$SERVICE_URL/health" >/dev/null
          CANARY_EPISODE="deploy-canary-${GITHUB_RUN_ID}"
          CANARY_ASSET="canary.txt"
          MULTIPART_ASSET="multipart-canary.bin"
          CANARY_BODY="whataboutit-upload-canary-${GITHUB_RUN_ID}"
          CANARY_HASH="$(printf '%s' "$CANARY_BODY" | sha256sum | cut -d' ' -f1)"
          CANARY_URL="$SERVICE_URL/episodes/$CANARY_EPISODE/assets/$CANARY_ASSET"
          cleanup_canary() {
            curl -fsS -X DELETE -H "x-whataboutit-key: $WHATABOUTIT_COLLAB_ACCESS_KEY" "$CANARY_URL" >/dev/null || true
            curl -fsS -X DELETE -H "x-whataboutit-key: $WHATABOUTIT_COLLAB_ACCESS_KEY" \
              "$SERVICE_URL/episodes/$CANARY_EPISODE/assets/$MULTIPART_ASSET" >/dev/null || true
          }
          trap cleanup_canary EXIT
          printf '%s' "$CANARY_BODY" | curl -fsS -X PUT \
            -H "x-whataboutit-key: $WHATABOUTIT_COLLAB_ACCESS_KEY" \
            -H "content-type: text/plain" \
            -H "x-content-sha256: $CANARY_HASH" \
            --data-binary @- \
            "$CANARY_URL" >/dev/null
          curl -fsSI -H "x-whataboutit-key: $WHATABOUTIT_COLLAB_ACCESS_KEY" "$CANARY_URL" \
            | tr -d '\r' \
            | grep -Fi "x-content-sha256: $CANARY_HASH" >/dev/null
          test "$(curl -fsS -H "x-whataboutit-key: $WHATABOUTIT_COLLAB_ACCESS_KEY" "$CANARY_URL")" = "$CANARY_BODY"

          # Exercise the same R2 multipart route used for long recordings.
          TEMP_DIR="$(mktemp -d)"
          dd if=/dev/zero of="$TEMP_DIR/part-1.bin" bs=1M count=5 status=none
          printf 'whataboutit-multipart-%s' "$GITHUB_RUN_ID" > "$TEMP_DIR/part-2.bin"
          MULTIPART_HASH="$(cat "$TEMP_DIR/part-1.bin" "$TEMP_DIR/part-2.bin" | sha256sum | cut -d' ' -f1)"
          MULTIPART_URL="$SERVICE_URL/episodes/$CANARY_EPISODE/assets/$MULTIPART_ASSET"
          CREATE_JSON="$(curl -fsS -X POST \
            -H "x-whataboutit-key: $WHATABOUTIT_COLLAB_ACCESS_KEY" \
            -H "content-type: application/octet-stream" \
            -H "x-content-sha256: $MULTIPART_HASH" \
            "$MULTIPART_URL?multipart=create")"
          UPLOAD_ID="$(printf '%s' "$CREATE_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).uploadId))")"
          PART_ONE="$(curl -fsS -X PUT -H "x-whataboutit-key: $WHATABOUTIT_COLLAB_ACCESS_KEY" \
            -H "content-type: application/octet-stream" --data-binary "@$TEMP_DIR/part-1.bin" \
            "$MULTIPART_URL?multipart=part&uploadId=$UPLOAD_ID&partNumber=1")"
          PART_TWO="$(curl -fsS -X PUT -H "x-whataboutit-key: $WHATABOUTIT_COLLAB_ACCESS_KEY" \
            -H "content-type: application/octet-stream" --data-binary "@$TEMP_DIR/part-2.bin" \
            "$MULTIPART_URL?multipart=part&uploadId=$UPLOAD_ID&partNumber=2")"
          COMPLETE_BODY="$(node -e 'const parts=process.argv.slice(1).map(value=>JSON.parse(value));process.stdout.write(JSON.stringify({parts}))' "$PART_ONE" "$PART_TWO")"
          curl -fsS -X POST -H "x-whataboutit-key: $WHATABOUTIT_COLLAB_ACCESS_KEY" \
            -H "content-type: application/json" --data-binary "$COMPLETE_BODY" \
            "$MULTIPART_URL?multipart=complete&uploadId=$UPLOAD_ID" >/dev/null
          curl -fsSI -H "x-whataboutit-key: $WHATABOUTIT_COLLAB_ACCESS_KEY" "$MULTIPART_URL" \
            | tr -d '\r' | grep -Fi "x-content-sha256: $MULTIPART_HASH" >/dev/null
          curl -fsS -H "x-whataboutit-key: $WHATABOUTIT_COLLAB_ACCESS_KEY" "$MULTIPART_URL" \
            | sha256sum | cut -d' ' -f1 | grep -Fx "$MULTIPART_HASH" >/dev/null
          rm -f "$TEMP_DIR/part-1.bin" "$TEMP_DIR/part-2.bin"
          rmdir "$TEMP_DIR"
          echo "WhatAboutIt Cloudflare deployment completed."
          echo "Authenticated direct and multipart R2 upload canaries passed."
          echo "Worker: $WHATABOUTIT_WORKER"
          echo "R2 bucket: $WHATABOUTIT_BUCKET"
          echo "Service URL: $SERVICE_URL"
          echo "Account is sourced only from WHATABOUTIT_CLOUDFLARE_ACCOUNT_ID."
