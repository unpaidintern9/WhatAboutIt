name: Publish Windows studio update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/release-main.yml"

permissions:
  contents: write

concurrency:
  group: what-about-it-main-release
  cancel-in-progress: true

jobs:
  publish-windows-update:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run verify
      - name: Give this main build a newer app version
        shell: pwsh
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version
      - name: Prepare What About It collaboration bootstrap
        shell: pwsh
        env:
          WHATABOUTIT_COLLAB_ACCESS_KEY: ${{ secrets.WHATABOUTIT_COLLAB_ACCESS_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WHATABOUTIT_COLLAB_ACCESS_KEY)) {
            throw "WHATABOUTIT_COLLAB_ACCESS_KEY is required to publish a connected What About It installer."
          }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $bootstrap = [ordered]@{
            apiUrl = "https://whataboutit-collab.whataboutit-collab.workers.dev"
            accessKey = $env:WHATABOUTIT_COLLAB_ACCESS_KEY
            personId = "morgan-owner"
          }
          $bootstrap | ConvertTo-Json -Compress | Set-Content -Path build/collaboration-bootstrap.json -NoNewline -Encoding utf8
          $verify = Get-Content build/collaboration-bootstrap.json -Raw | ConvertFrom-Json
          if ($verify.apiUrl -ne "https://whataboutit-collab.whataboutit-collab.workers.dev") { throw "Unexpected collaboration URL in bootstrap." }
          if ([string]::IsNullOrWhiteSpace($verify.accessKey)) { throw "Collaboration bootstrap access key is empty." }
      - name: Create the matching GitHub release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$version" "${{ github.sha }}"
          git push origin "v$version"
      - name: Build the compiled Electron application
        run: npm run build
      - name: Build Windows installer
        shell: pwsh
        run: npx electron-builder --win nsis --publish never
      - name: Publish and verify newest GitHub release assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $installers = @(Get-ChildItem -Path release -Filter "*.exe" -File)
          $blockMaps = @(Get-ChildItem -Path release -Filter "*.exe.blockmap" -File)
          $manifest = Get-Item -Path release/latest.yml -ErrorAction SilentlyContinue
          if ($installers.Count -ne 1) { throw "Expected one Windows installer, found $($installers.Count)." }
          if ($blockMaps.Count -ne 1) { throw "Expected one installer block map, found $($blockMaps.Count)." }
          if (-not $manifest) { throw "The updater manifest release/latest.yml was not generated." }
          if ((Get-Content $manifest.FullName -Raw) -notmatch [regex]::Escape($installers[0].Name)) { throw "The updater manifest does not point to $($installers[0].Name)." }

          # Stable releases make GitHub's latest release endpoint authoritative.
          # electron-updater can therefore jump directly from any older build to
          # this newest installer instead of following intermediate prereleases.
          gh release create $tag --repo "${{ github.repository }}" --title "What About It Studio $version" --notes "Automated Windows studio update $version." --latest --verify-tag
          gh release upload $tag $installers[0].FullName $blockMaps[0].FullName $manifest.FullName --repo "${{ github.repository }}" --clobber

          $release = gh release view $tag --repo "${{ github.repository }}" --json isPrerelease,isDraft,assets | ConvertFrom-Json
          if ($release.isPrerelease -or $release.isDraft) { throw "Updater release must be a published stable release." }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($requiredAsset in @($installers[0].Name, $blockMaps[0].Name, $manifest.Name)) {
            if ($assetNames -notcontains $requiredAsset) { throw "Published release is missing $requiredAsset." }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
