name: Publish Windows studio update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/release-main.yml"

permissions:
  contents: write

concurrency:
  group: what-about-it-main-release
  cancel-in-progress: true

jobs:
  publish-windows-update:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run verify
      - name: Give this main build a newer app version
        shell: pwsh
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version
      - name: Build the compiled Electron application
        run: npm run build
      - name: Build installer and publish GitHub prerelease
        shell: pwsh
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
